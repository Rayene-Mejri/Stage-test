<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - StageApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --primary: #818cf8;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.05);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card {
            background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
            border-radius: 12px; padding: 40px; width: 100%; max-width: 400px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .login-card h2 { margin-bottom: 10px; color: var(--text-main); font-weight: 600; }
        .login-card p { color: var(--text-muted); margin-bottom: 30px; font-size: 0.9rem; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-control {
            width: 100%; padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border);
            border-radius: 8px; color: var(--text-main); transition: 0.3s;
        }
        .form-control:focus { border-color: var(--primary); outline: none; }
        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 500;
            display: inline-block; transition: 0.3s; text-decoration: none; font-size: 1rem;
        }
        .btn-primary { background: var(--primary); color: white; margin-bottom: 20px; }
        .btn-primary:hover { filter: brightness(1.1); }
        .alert { padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; text-align: left; }
        .alert-error { background: rgba(248, 113, 113, 0.1); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }
        .register-link { margin-top: 20px; display: block; color: var(--text-muted); font-size: 0.9rem; }
        .register-link a { color: var(--primary); text-decoration: none; }
        .register-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Create an Account</h2>
        <p>Join StageApp today</p>
        
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>
        
        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <input type="text" class="form-control" name="username" placeholder="Username" required autofocus>
            </div>
            <div class="form-group">
                <input type="password" class="form-control" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
        
        <div class="register-link">
            Already have an account? <a th:href="@{/login}">Sign in here</a>
        </div>
    </div>
</body>
</html>
