<!DOCTYPE html>
<html th:replace="~{fragments/layout :: page(title=${pageTitle}, content=~{::mainContent})}">
<body>
<div th:fragment="mainContent">
    <div class="glass-card" style="max-width: 600px; margin: 0 auto;">
        <form th:action="@{/projects/save}" th:object="${project}" method="post">
            <input type="hidden" th:field="*{id}">
            
            <div class="form-group">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" th:field="*{name}" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label class="form-label">Department</label>
                    <select class="form-control" th:field="*{department.id}">
                        <option value="">-- Unassigned --</option>
                        <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Status</label>
                    <select class="form-control" th:field="*{status}" required>
                        <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"></option>
                    </select>
                </div>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label class="form-label">Start Date</label>
                    <input type="date" class="form-control" th:field="*{startDate}">
                </div>
                <div class="form-group">
                    <label class="form-label">End Date</label>
                    <input type="date" class="form-control" th:field="*{endDate}">
                </div>
            </div>
            
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button type="submit" class="btn btn-success">Save Project</button>
                <a th:href="@{/projects}" class="btn" style="background: rgba(255,255,255,0.1); color: white;">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
