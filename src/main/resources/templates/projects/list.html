<!DOCTYPE html>
<html th:replace="~{fragments/layout :: page(title='Projects', content=~{::mainContent})}">
<body>
<div th:fragment="mainContent">
    
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <div class="glass-card">
        <div class="top-actions">
            <form th:action="@{/projects}" method="get" class="search-form">
                <input type="text" name="keyword" th:value="${keyword}" placeholder="Search projects..." class="form-control" style="width: 250px;">
                <button type="submit" class="btn btn-primary">Search</button>
            </form>
            <a th:href="@{/projects/new}" class="btn btn-success">+ Add New</a>
        </div>

        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Status</th>
                        <th>Start Date</th>
                        <th>End Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="proj : ${projects}">
                        <td th:text="${proj.id}">1</td>
                        <td>
                            <div th:text="${proj.name}" style="font-weight: 500;">Name</div>
                            <div th:text="${proj.description}" style="font-size: 0.8rem; color: var(--text-muted); max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Desc</div>
                        </td>
                        <td>
                            <span class="badge badge-primary" th:if="${proj.department != null}" th:text="${proj.department.name}">Dept</span>
                            <span class="badge badge-gray" th:if="${proj.department == null}">None</span>
                        </td>
                        <td>
                            <span class="badge badge-amber" th:if="${proj.status == 'PLANNING'}">PLANNING</span>
                            <span class="badge badge-cyan" th:if="${proj.status == 'IN_PROGRESS'}">IN_PROGRESS</span>
                            <span class="badge badge-green" th:if="${proj.status == 'COMPLETED'}">COMPLETED</span>
                            <span class="badge badge-gray" th:if="${proj.status == 'ON_HOLD'}">ON_HOLD</span>
                        </td>
                        <td th:text="${#temporals.format(proj.startDate, 'yyyy-MM-dd')}">Date</td>
                        <td th:text="${#temporals.format(proj.endDate, 'yyyy-MM-dd')}">Date</td>
                        <td>
                            <a th:href="@{'/projects/edit/' + ${proj.id}}" class="btn btn-sm btn-primary">Edit</a>
                            <a th:href="@{'/projects/delete/' + ${proj.id}}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this project?')">Delete</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(projects)}">
                        <td colspan="7" style="text-align: center; color: var(--text-muted);">No projects found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
