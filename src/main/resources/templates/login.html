<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StageApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --primary: #818cf8;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.05);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card {
            background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
            border-radius: 12px; padding: 40px; width: 100%; max-width: 400px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .login-card h2 { margin-bottom: 10px; color: var(--text-main); font-weight: 600; }
        .login-card p { color: var(--text-muted); margin-bottom: 30px; font-size: 0.9rem; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-control {
            width: 100%; padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border);
            border-radius: 8px; color: var(--text-main); transition: 0.3s;
        }
        .form-control:focus { border-color: var(--primary); outline: none; }
        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 500;
            display: inline-block; transition: 0.3s; text-decoration: none; font-size: 1rem;
        }
        .btn-primary { background: var(--primary); color: white; margin-bottom: 20px; }
        .btn-primary:hover { filter: brightness(1.1); }
        .divider { display: flex; align-items: center; margin: 20px 0; color: var(--text-muted); font-size: 0.9rem; }
        .divider::before, .divider::after { content: ""; flex: 1; border-bottom: 1px solid var(--glass-border); margin: 0 10px; }
        .btn-google {
            background: white; color: #333; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-google:hover { background: #f1f5f9; }
        .alert { padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; text-align: left; }
        .alert-error { background: rgba(248, 113, 113, 0.1); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }
        .alert-success { background: rgba(74, 222, 128, 0.1); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); }
        .register-link { margin-top: 20px; display: block; color: var(--text-muted); font-size: 0.9rem; }
        .register-link a { color: var(--primary); text-decoration: none; }
        .register-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Welcome Back</h2>
        <p>Sign in to access StageApp</p>
        
        <div th:if="${param.error}" class="alert alert-error">Invalid username and password.</div>
        <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>
        
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <input type="text" class="form-control" name="username" placeholder="Username" required autofocus>
            </div>
            <div class="form-group">
                <input type="password" class="form-control" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>
        
        <div class="divider">or</div>
        
        <a th:href="@{/oauth2/authorization/google}" class="btn btn-google">
            <svg viewBox="0 0 24 24" width="20" height="20">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Sign in with Google
        </a>
        
        <div class="register-link">
            Don't have an account? <a th:href="@{/register}">Register here</a>
        </div>
    </div>
</body>
</html>
