<!DOCTYPE html>
<html th:replace="~{fragments/layout :: page(title='Dashboard', content=~{::mainContent})}">
<body>
<div th:fragment="mainContent">
    <div class="dashboard-grid">
        <div class="glass-card">
            <div style="font-size: 2rem; margin-bottom: 10px;">🏢</div>
            <h3 style="font-size: 2rem; color: var(--text-main); margin-bottom: 5px;" th:text="${departmentCount ?: 0}">0</h3>
            <p style="color: var(--text-muted); margin-bottom: 15px;">Departments</p>
            <div style="display:flex; gap: 10px;">
                <a th:href="@{/departments}" class="btn btn-primary" style="flex:1; text-align:center;">View All</a>
                <a th:href="@{/departments/new}" class="btn btn-success">+ Add</a>
            </div>
        </div>
        <div class="glass-card">
            <div style="font-size: 2rem; margin-bottom: 10px;">👥</div>
            <h3 style="font-size: 2rem; color: var(--text-main); margin-bottom: 5px;" th:text="${employeeCount ?: 0}">0</h3>
            <p style="color: var(--text-muted); margin-bottom: 15px;">Employees</p>
            <div style="display:flex; gap: 10px;">
                <a th:href="@{/employees}" class="btn btn-primary" style="flex:1; text-align:center;">View All</a>
                <a th:href="@{/employees/new}" class="btn btn-success">+ Add</a>
            </div>
        </div>
        <div class="glass-card">
            <div style="font-size: 2rem; margin-bottom: 10px;">🚀</div>
            <h3 style="font-size: 2rem; color: var(--text-main); margin-bottom: 5px;" th:text="${projectCount ?: 0}">0</h3>
            <p style="color: var(--text-muted); margin-bottom: 15px;">Projects</p>
            <div style="display:flex; gap: 10px;">
                <a th:href="@{/projects}" class="btn btn-primary" style="flex:1; text-align:center;">View All</a>
                <a th:href="@{/projects/new}" class="btn btn-success">+ Add</a>
            </div>
        </div>
        <div class="glass-card">
            <div style="font-size: 2rem; margin-bottom: 10px;">💻</div>
            <h3 style="font-size: 2rem; color: var(--text-main); margin-bottom: 5px;" th:text="${equipmentCount ?: 0}">0</h3>
            <p style="color: var(--text-muted); margin-bottom: 15px;">Equipment</p>
            <div style="display:flex; gap: 10px;">
                <a th:href="@{/equipments}" class="btn btn-primary" style="flex:1; text-align:center;">View All</a>
                <a th:href="@{/equipments/new}" class="btn btn-success">+ Add</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
