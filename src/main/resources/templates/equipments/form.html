<!DOCTYPE html>
<html th:replace="~{fragments/layout :: page(title=${pageTitle}, content=~{::mainContent})}">
<body>
<div th:fragment="mainContent">
    <div class="glass-card" style="max-width: 600px; margin: 0 auto;">
        <form th:action="@{/equipments/save}" th:object="${equipment}" method="post">
            <input type="hidden" th:field="*{id}">
            
            <div class="form-group">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" th:field="*{name}" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Serial Number</label>
                <input type="text" class="form-control" th:field="*{serialNumber}" required>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <input type="text" class="form-control" th:field="*{category}">
                </div>
                <div class="form-group">
                    <label class="form-label">Purchase Date</label>
                    <input type="date" class="form-control" th:field="*{purchaseDate}">
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Assigned To Employee</label>
                <select class="form-control" th:field="*{employee.id}">
                    <option value="">-- Unassigned --</option>
                    <option th:each="emp : ${employees}" th:value="${emp.id}" th:text="${emp.firstName + ' ' + emp.lastName}"></option>
                </select>
            </div>
            
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button type="submit" class="btn btn-success">Save Equipment</button>
                <a th:href="@{/equipments}" class="btn" style="background: rgba(255,255,255,0.1); color: white;">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
