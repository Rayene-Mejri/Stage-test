<!DOCTYPE html>
<html th:replace="~{fragments/layout :: page(title='Equipment', content=~{::mainContent})}">
<body>
<div th:fragment="mainContent">
    
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <div class="glass-card">
        <div class="top-actions">
            <form th:action="@{/equipments}" method="get" class="search-form">
                <input type="text" name="keyword" th:value="${keyword}" placeholder="Search equipment..." class="form-control" style="width: 250px;">
                <button type="submit" class="btn btn-primary">Search</button>
            </form>
            <a th:href="@{/equipments/new}" class="btn btn-success">+ Add New</a>
        </div>

        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Serial Number</th>
                        <th>Category</th>
                        <th>Purchase Date</th>
                        <th>Assigned To</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="equip : ${equipments}">
                        <td th:text="${equip.id}">1</td>
                        <td th:text="${equip.name}">Name</td>
                        <td><span class="badge badge-mono" th:text="${equip.serialNumber}">SN</span></td>
                        <td th:text="${equip.category}">Category</td>
                        <td th:text="${#temporals.format(equip.purchaseDate, 'yyyy-MM-dd')}">Date</td>
                        <td>
                            <span class="badge badge-primary" th:if="${equip.employee != null}" th:text="${equip.employee.firstName + ' ' + equip.employee.lastName}">Emp</span>
                            <span class="badge badge-gray" th:if="${equip.employee == null}">Unassigned</span>
                        </td>
                        <td>
                            <a th:href="@{'/equipments/edit/' + ${equip.id}}" class="btn btn-sm btn-primary">Edit</a>
                            <a th:href="@{'/equipments/delete/' + ${equip.id}}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this equipment?')">Delete</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(equipments)}">
                        <td colspan="7" style="text-align: center; color: var(--text-muted);">No equipment found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
