<!DOCTYPE html>
<html th:replace="~{fragments/layout :: page(title='Departments', content=~{::mainContent})}">
<body>
<div th:fragment="mainContent">
    
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <div class="glass-card">
        <div class="top-actions">
            <form th:action="@{/departments}" method="get" class="search-form">
                <input type="text" name="keyword" th:value="${keyword}" placeholder="Search departments..." class="form-control" style="width: 250px;">
                <button type="submit" class="btn btn-primary">Search</button>
            </form>
            <a th:href="@{/departments/new}" class="btn btn-success">+ Add New</a>
        </div>

        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Code</th>
                        <th>Name</th>
                        <th>Location</th>
                        <th>Budget</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="dept : ${departments}">
                        <td th:text="${dept.id}">1</td>
                        <td><span class="badge badge-mono" th:text="${dept.code}">DPT</span></td>
                        <td th:text="${dept.name}">Name</td>
                        <td th:text="${dept.location}">Location</td>
                        <td th:text="${'$' + #numbers.formatDecimal(dept.budget, 1, 2)}">$0.00</td>
                        <td>
                            <a th:href="@{'/departments/edit/' + ${dept.id}}" class="btn btn-sm btn-primary">Edit</a>
                            <a th:href="@{'/departments/delete/' + ${dept.id}}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this department?')">Delete</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(departments)}">
                        <td colspan="6" style="text-align: center; color: var(--text-muted);">No departments found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
