<!DOCTYPE html>
<html th:replace="~{fragments/layout :: page(title=${pageTitle}, content=~{::mainContent})}">
<body>
<div th:fragment="mainContent">
    <div class="glass-card" style="max-width: 600px; margin: 0 auto;">
        <form th:action="@{/departments/save}" th:object="${department}" method="post">
            <input type="hidden" th:field="*{id}">
            
            <div class="form-group">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" th:field="*{name}" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Code</label>
                <input type="text" class="form-control" th:field="*{code}" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Location</label>
                <input type="text" class="form-control" th:field="*{location}">
            </div>
            
            <div class="form-group">
                <label class="form-label">Budget</label>
                <input type="number" step="0.01" class="form-control" th:field="*{budget}">
            </div>
            
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button type="submit" class="btn btn-success">Save Department</button>
                <a th:href="@{/departments}" class="btn" style="background: rgba(255,255,255,0.1); color: white;">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
