<!DOCTYPE html>
<html th:replace="~{fragments/layout :: page(title='Employees', content=~{::mainContent})}">
<body>
<div th:fragment="mainContent">
    
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <div class="glass-card">
        <div class="top-actions">
            <form th:action="@{/employees}" method="get" class="search-form">
                <input type="text" name="keyword" th:value="${keyword}" placeholder="Search employees..." class="form-control" style="width: 250px;">
                <button type="submit" class="btn btn-primary">Search</button>
            </form>
            <a th:href="@{/employees/new}" class="btn btn-success">+ Add New</a>
        </div>

        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Job Title</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th>Hire Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="emp : ${employees}">
                        <td th:text="${emp.id}">1</td>
                        <td th:text="${emp.firstName + ' ' + emp.lastName}">Name</td>
                        <td th:text="${emp.email}">Email</td>
                        <td th:text="${emp.jobTitle}">Title</td>
                        <td>
                            <span class="badge badge-primary" th:if="${emp.department != null}" th:text="${emp.department.name}">Dept</span>
                            <span class="badge badge-gray" th:if="${emp.department == null}">None</span>
                        </td>
                        <td th:text="${'$' + #numbers.formatDecimal(emp.salary, 1, 2)}">$0.00</td>
                        <td th:text="${#temporals.format(emp.hireDate, 'yyyy-MM-dd')}">Date</td>
                        <td>
                            <a th:href="@{'/employees/edit/' + ${emp.id}}" class="btn btn-sm btn-primary">Edit</a>
                            <a th:href="@{'/employees/delete/' + ${emp.id}}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this employee?')">Delete</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(employees)}">
                        <td colspan="8" style="text-align: center; color: var(--text-muted);">No employees found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
