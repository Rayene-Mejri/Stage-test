<!DOCTYPE html>
<html th:replace="~{fragments/layout :: page(title=${pageTitle}, content=~{::mainContent})}">
<body>
<div th:fragment="mainContent">
    <div class="glass-card" style="max-width: 600px; margin: 0 auto;">
        <form th:action="@{/employees/save}" th:object="${employee}" method="post">
            <input type="hidden" th:field="*{id}">
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label class="form-label">First Name</label>
                    <input type="text" class="form-control" th:field="*{firstName}" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Last Name</label>
                    <input type="text" class="form-control" th:field="*{lastName}" required>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" th:field="*{email}" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Job Title</label>
                <input type="text" class="form-control" th:field="*{jobTitle}">
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label class="form-label">Salary</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{salary}">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Hire Date</label>
                    <input type="date" class="form-control" th:field="*{hireDate}" required>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Department</label>
                <select class="form-control" th:field="*{department.id}">
                    <option value="">-- Unassigned --</option>
                    <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
                </select>
            </div>
            
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button type="submit" class="btn btn-success">Save Employee</button>
                <a th:href="@{/employees}" class="btn" style="background: rgba(255,255,255,0.1); color: white;">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
